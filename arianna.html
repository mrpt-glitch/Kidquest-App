<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Arianna</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0C0A1E;color:#fff;padding:16px}
.card{background:#1a1633;border-radius:16px;padding:14px;margin:10px 0;display:flex;gap:12px;align-items:center}
.icon{font-size:2rem}.done{opacity:.35;text-decoration:line-through}
button{margin-left:auto;border:0;border-radius:999px;padding:8px 12px;background:#7c5cff;color:#fff}
.empty{opacity:.6;padding:40px 0;text-align:center}a{color:#b9a6ff}
</style>
</head>
<body>
<h1>Arianna</h1>
<p>First / Then · Mon–Fri</p>
<div id="list"></div>
<p class="empty" id="empty">No tasks yet. <a href="parent.html">Add tasks</a></p>
<p id="stars"></p>
<script>
const KEY='arianna-weekday-v2';
async function load(){
  const saved=localStorage.getItem(KEY);
  if(saved) return JSON.parse(saved);
  const res=await fetch('data/arianna-weekday.json');
  return res.json();
}
function render(data){
  const tasks=data.tasks||[];
  const done=JSON.parse(localStorage.getItem(KEY+'-done')||'{}');
  const list=document.getElementById('list'); list.innerHTML='';
  document.getElementById('empty').style.display=tasks.length?'none':'block';
  tasks.forEach((t,i)=>{
    const next=tasks[i+1];
    const el=document.createElement('div');
    el.className='card'+(done[t.id]?' done':'');
    el.innerHTML=`<div class="icon">${t.icon||'⭐'}</div><div><b>FIRST: ${t.time||''} ${t.title||''}</b><div>${t.goal||t.note||''}</div>${next?`<div>THEN: ${next.icon||''} ${next.title||''}</div>`:''}</div><button>${done[t.id]?'Undo':'Done ⭐'}</button>`;
    el.querySelector('button').onclick=()=>{done[t.id]=!done[t.id];localStorage.setItem(KEY+'-done',JSON.stringify(done));render(data)};
    list.appendChild(el);
  });
  document.getElementById('stars').textContent=tasks.length?('Stars: '+Object.values(done).filter(Boolean).length):'';
}
load().then(render);
</script>
</body>
</html>
