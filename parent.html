<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Add tasks</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0C0A1E;color:#fff;padding:16px}
select,input{width:100%;box-sizing:border-box;margin:4px 0 10px;padding:12px;border-radius:10px;border:0;font-size:16px}
.row{background:#1a1633;padding:12px;border-radius:14px;margin:10px 0}
button{border:0;border-radius:12px;padding:10px 14px;background:#7c5cff;color:#fff;margin:6px 8px 6px 0}
.empty{opacity:.6;padding:24px 0}
a{color:#b9a6ff}
</style>
</head>
<body>
<h1>Add tasks</h1>
<p>Clean boards. Mon–Fri only.</p>
<label>Who</label>
<select id="kid" onchange="switchKid()">
  <option value="oliver">Oliver</option>
  <option value="arianna">Arianna</option>
</select>
<div id="rows"></div>
<p class="empty" id="empty">No tasks yet. Tap Add task.</p>
<button onclick="add()">+ Add task</button>
<button onclick="save()">Save</button>
<p><a id="boardLink" href="oliver.html">Open board</a></p>
<script>
const FILES={oliver:'data/oliver-weekday.json',arianna:'data/arianna-weekday.json'};
const NAMES={oliver:'Oliver',arianna:'Arianna'};
let kid='oliver';
let data={child:'Oliver',appliesTo:['monday','tuesday','wednesday','thursday','friday'],tasks:[]};
function key(){return kid+'-weekday-v2';}
async function switchKid(){
  kid=document.getElementById('kid').value;
  document.getElementById('boardLink').href=kid+'.html';
  const saved=localStorage.getItem(key());
  if(saved) data=JSON.parse(saved);
  else {
    try{const r=await fetch(FILES[kid]); data=await r.json();}
    catch(e){data={child:NAMES[kid],appliesTo:['monday','tuesday','wednesday','thursday','friday'],tasks:[]};}
  }
  if(!data.tasks) data.tasks=[];
  draw();
}
function draw(){
  const box=document.getElementById('rows'); box.innerHTML='';
  data.tasks.forEach((t,i)=>{
    const d=document.createElement('div'); d.className='row';
    d.innerHTML=`<input data-i="${i}" data-k="time" value="${t.time||''}" placeholder="Time"/>
      <input data-i="${i}" data-k="icon" value="${t.icon||''}" placeholder="Emoji"/>
      <input data-i="${i}" data-k="title" value="${t.title||''}" placeholder="Task"/>
      <input data-i="${i}" data-k="goal" value="${t.goal||t.note||''}" placeholder="Goal / note"/>
      <button onclick="del(${i})">Delete</button>`;
    box.appendChild(d);
  });
  box.querySelectorAll('input').forEach(inp=>inp.oninput=e=>{
    data.tasks[+e.target.dataset.i][e.target.dataset.k]=e.target.value;
  });
  document.getElementById('empty').style.display=data.tasks.length?'none':'block';
}
function add(){data.tasks.push({id:'t'+Date.now(),time:'',icon:'⭐',title:'',goal:''});draw();}
function del(i){data.tasks.splice(i,1);draw();}
function save(){localStorage.setItem(key(),JSON.stringify(data));alert('Saved for '+NAMES[kid]);}
switchKid();
</script>
</body>
</html>
